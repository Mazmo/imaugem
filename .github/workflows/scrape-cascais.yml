name: Scrape MaisConsultores RealEstateCascais Phones

on:
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright
        run: |
          npm init -y
          npm install playwright
          npx playwright install chromium --with-deps

      - name: Scrape agent phones
        run: node scrape_gh_action.js
        env:
          CI: true

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: cascais-phones
          path: cascais_phones.json
          if-no-files-found: warn
