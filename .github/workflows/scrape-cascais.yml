name: Scrape MaisConsultores RealEstateCascais Phones

on:
  push:
    branches:
      - claude/extract-cascais-leads-IcDrb
    paths:
      - 'scrape_gh_action.js'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright
        run: |
          npm init -y
          npm install playwright
          npx playwright install chromium --with-deps

      - name: Scrape agent phones
        run: node scrape_gh_action.js
        env:
          CI: true

      - name: Commit results back to branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add cascais_phones.json agency_page.html || true
          git diff --cached --quiet || git commit -m "chore: add scrape results [skip ci]"
          git push
